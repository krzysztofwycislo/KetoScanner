name: carbpeek-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: carbpeek
      POSTGRES_USER: carbpeek
      POSTGRES_PASSWORD: carbpeek
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbpeek -d carbpeek"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    profiles: [server]
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/carbpeek
      DB_USER: carbpeek
      DB_PASSWORD: carbpeek
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
