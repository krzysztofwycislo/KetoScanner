name: Server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Shared tests
        run: ./gradlew --console=plain -p shared test

      - name: Server build
        run: ./gradlew --console=plain -p server build

      - name: Server integration tests
        run: ./gradlew --console=plain -p server integrationTest

      - name: jOOQ drift check
        run: |
          ./gradlew --console=plain -p server generateJooq
          if [ -n "$(git status --porcelain -- server/src/generated)" ]; then
            git diff -- server/src/generated
            git status --porcelain -- server/src/generated
            echo "::error::server/src/generated is out of date. Run generateJooq and commit the result."
            exit 1
          fi

      - name: Docker image build
        run: docker build -f server/Dockerfile --build-arg SERVER_VERSION=${{ github.sha }} .
